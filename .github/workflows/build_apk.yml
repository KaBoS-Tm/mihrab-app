name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Clean Flutter Android Workspace
        run: |
          # حفظ ملفات التطبيق
          mkdir -p /tmp/app_src
          cp -r lib assets pubspec.yaml /tmp/app_src/

          # إنشاء هيكل أندرويد رسمي متكامل
          cd $RUNNER_TEMP
          rm -rf mihrab_workspace
          flutter create mihrab_workspace --org com.mihrab.app --platforms android
          cd mihrab_workspace

          # استبدال الملفات بملفاتنا
          rm -rf lib assets pubspec.yaml
          cp -r /tmp/app_src/* .

          # تحديث الـ minSdkVersion إلى 21 لضمان توافق الحزم
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle || true

          # تنزيل الحزم
          flutter pub get

          # البناء بصيغة release بدون توقيع معقد
          flutter build apk --release --no-tree-shake-icons

          # تجهيز الملف للتحميل
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mihrab-release-apk
          path: output/app-release.apk
