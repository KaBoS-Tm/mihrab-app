<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مِحْرَابُ الإِمَام | رفيق التلاوة والوقف</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F382A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* استدعاء خط مجمع الملك فهد لطباعة المصحف الشريف بالمدينة المنورة برسم حفص */
    @font-face {
      font-family: 'KFGQPC Uthmanic Naskh';
      src: url('https://cdn.jsdelivr.net/gh/quran/quran.com-frontend@master/public/fonts/quran/hafs/uthmanic_hafs_v22.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --primary: #0F382A;
      --primary-light: #18533E;
      --gold: #C5A059;
      --gold-light: #DFCA95;
      --gold-glow: rgba(197, 160, 89, 0.25);
      --bg: #F7F5EE;
      --card-bg: #FFFFFF;
      --text-main: #19221E;
      --text-muted: #5D6B64;
      --border-subtle: #E8E2D2;
      --border-gold: rgba(197, 160, 89, 0.45);
      --shadow-sm: 0 4px 14px rgba(15, 56, 42, 0.05);
      --shadow-lg: 0 12px 32px rgba(15, 56, 42, 0.12);
      --radius: 18px;
      --transition: all 0.25s ease;
      --quran-font-size: 1.6rem;
      --reader-font-size: 1.75rem;
    }

    body.dark-mode {
      --primary: #174233;
      --primary-light: #215945;
      --gold: #D6B26B;
      --gold-light: #F0DFC0;
      --gold-glow: rgba(214, 178, 107, 0.2);
      --bg: #0C1512;
      --card-bg: #141F1B;
      --text-main: #E9ECE9;
      --text-muted: #9EAEA6;
      --border-subtle: #24352D;
      --border-gold: rgba(214, 178, 107, 0.35);
      --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 70px;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      width: 100%;
      background: linear-gradient(135deg, #071D15 0%, var(--primary) 100%);
      color: #fff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    }

    .header-content {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: #FFFFFF;
      white-space: nowrap;
    }

    .brand-title span.accent {
      color: var(--gold-light);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--border-gold);
      color: #FFFFFF;
      height: 36px;
      padding: 0 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .icon-btn:hover {
      background: var(--gold);
      color: var(--primary);
    }

    .container {
      width: 100%;
      max-width: 820px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-subtle);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-input-wrap {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 10px 38px 10px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border-subtle);
      background: var(--bg);
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--gold);
    }

    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--text-muted);
    }

    .prayers-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .prayer-btn {
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 8px 2px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .prayer-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--gold);
    }

    .book-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border-subtle);
      gap: 4px;
    }

    .book-tab-btn {
      background: transparent;
      border: none;
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      font-weight: 800;
      border: 1px solid var(--border-gold);
    }

    body.dark-mode .book-tab-btn.active {
      color: var(--gold);
    }

    .horizontal-scroll-filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .horizontal-scroll-filters::-webkit-scrollbar { display: none; }

    .chip-filter {
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chip-filter.active {
      background: var(--gold);
      color: #0F382A;
      font-weight: 800;
      border-color: var(--gold);
    }

    .memorization-scope-card {
      background: linear-gradient(135deg, rgba(197, 160, 89, 0.1) 0%, rgba(15, 56, 42, 0.06) 100%);
      border: 1.5px solid var(--border-gold);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .scope-info-title {
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    body.dark-mode .scope-info-title { color: var(--gold-light); }

    .scope-info-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .scope-edit-btn {
      background: var(--primary);
      color: #FFFFFF;
      border: 1px solid var(--gold);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .card-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1.5px solid var(--border-gold);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .card-header-bar {
      background: rgba(197, 160, 89, 0.08);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .surah-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .surah-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--primary);
    }
    body.dark-mode .surah-title { color: var(--gold); }

    .ayat-tag {
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .topic-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(15, 56, 42, 0.08);
      color: var(--primary);
      border: 1px solid var(--border-subtle);
    }
    body.dark-mode .topic-badge { background: rgba(214, 178, 107, 0.12); color: var(--gold-light); }

    .card-content {
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* تطبيق خط مجمع الملك فهد مع إعدادات ربط الحروف والتشكيل */
    .quran-text-wrapper, .mushaf-page-frame {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px 14px;
      text-align: justify;
      text-align-last: center;
      line-height: 2.85;
      font-family: 'KFGQPC Uthmanic Naskh', 'Amiri Quran', serif !important;
      font-size: var(--quran-font-size);
      color: var(--text-main);
      direction: rtl;
      font-feature-settings: "liga" 1, "calt" 1, "mkmk" 1, "mark" 1;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .verse-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-family: 'KFGQPC Uthmanic Naskh', 'Amiri Quran', serif !important;
      font-size: 1.35rem;
      margin: 0 3px;
      font-weight: bold;
    }

    .rakah-box {
      background: rgba(15, 56, 42, 0.05);
      border: 1px solid rgba(15, 56, 42, 0.15);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--primary);
    }
    body.dark-mode .rakah-box { color: var(--gold-light); border-color: rgba(214,178,107,0.25); }

    .confirm-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--gold) 0%, #A8833A 100%);
      color: #FFFFFF;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* نافذة استوديو الحفظ */
    .scope-modal-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      border-radius: var(--radius);
      border: 1.5px solid var(--border-gold);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .juz-grid-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      padding: 8px 0;
    }

    .juz-btn {
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 2px;
      text-align: center;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .juz-btn.selected {
      background: var(--gold);
      color: var(--primary);
      border-color: var(--gold);
    }

    .surah-checklist {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      max-height: 350px;
      overflow-y: auto;
    }

    .surah-check-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg);
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    /* متصفح المصحف والكتب */
    .reader-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      z-index: 2500;
      display: none;
      flex-direction: column;
    }

    .reader-header {
      background: var(--primary);
      color: #FFFFFF;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold);
    }

    .reader-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .reader-index-sidebar {
      width: 260px;
      border-left: 1px solid var(--border-subtle);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
    }

    .reader-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .surah-banner {
      background: linear-gradient(135deg, rgba(197, 160, 89, 0.15) 0%, rgba(15, 56, 42, 0.08) 100%);
      border: 1px solid var(--gold);
      border-radius: 10px;
      padding: 6px;
      text-align: center;
      margin: 14px 0;
      font-weight: 900;
      font-size: 1.15rem;
      color: var(--primary);
    }
    body.dark-mode .surah-banner { color: var(--gold-light); }

    .basmalah {
      text-align: center;
      font-family: 'KFGQPC Uthmanic Naskh', 'Amiri Quran', serif !important;
      font-size: 1.55rem;
      color: var(--gold);
      margin-bottom: 16px;
      display: block;
    }

    @media (max-width: 700px) {
      .reader-index-sidebar { display: none; }
      .reader-index-sidebar.mobile-open {
        display: flex;
        position: absolute;
        top: 50px; bottom: 50px; right: 0;
        width: 80%;
        z-index: 10;
        box-shadow: -4px 0 16px rgba(0,0,0,0.3);
      }
      .juz-grid-selector { grid-template-columns: repeat(5, 1fr); }
      .surah-checklist { grid-template-columns: 1fr; }
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
    }

    .modal-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      max-height: 82vh;
      border-radius: var(--radius);
      border: 1px solid var(--border-gold);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 16px;
      background: var(--primary);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
    }

    .modal-body {
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="brand-title">مِحْرَابُ <span class="accent">الإِمَام</span></div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openReaderModal('quran')">📖 تصفح الكتب</button>
        <button class="icon-btn" onclick="toggleDarkMode()" style="padding:0 8px;">🌙</button>
        <button class="icon-btn" onclick="openLockedModal()">
          <span>⏳</span>
          <span id="cooldownCounter">المحظورة (0)</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="control-card">
      <div class="search-input-wrap">
        <input type="text" id="liveSearch" class="search-input" placeholder="ابحث عن سورة، أو كلمة، أو موضوع..." oninput="handleSearch(this.value)">
        <span class="search-icon">🔍</span>
      </div>

      <div class="prayers-grid">
        <button class="prayer-btn" onclick="setPrayer('fajr', this)">الفجر</button>
        <button class="prayer-btn" onclick="setPrayer('dhuhr', this)">الظهر</button>
        <button class="prayer-btn" onclick="setPrayer('asr', this)">العصر</button>
        <button class="prayer-btn active" onclick="setPrayer('maghrib', this)">المغرب</button>
        <button class="prayer-btn" onclick="setPrayer('isha', this)">العشاء</button>
      </div>

      <div class="book-tabs">
        <button class="book-tab-btn" onclick="setBookFilter('shortEasy', this)">📖 قـصـار السور</button>
        <button class="book-tab-btn" onclick="setBookFilter('mediumSelected', this)">📚 آيات مختارة</button>
        <button class="book-tab-btn active" onclick="setBookFilter('all', this)">✨ كلاهما معاً</button>
      </div>

      <div class="horizontal-scroll-filters">
        <button class="chip-filter active" onclick="setLengthFilter('all', this)">الكل</button>
        <button class="chip-filter" onclick="setLengthFilter('very_short', this)">قصير جداً</button>
        <button class="chip-filter" onclick="setLengthFilter('short', this)">قصير</button>
        <button class="chip-filter" onclick="setLengthFilter('medium', this)">متوسط</button>
        <button class="chip-filter" onclick="setLengthFilter('long', this)">طويل</button>
      </div>

      <div class="horizontal-scroll-filters">
        <button class="chip-filter active" onclick="setTopicFilter('all', this)">كافة الموضوعات</button>
        <button class="chip-filter" onclick="setTopicFilter('paradise', this)">نعيم الجنة</button>
        <button class="chip-filter" onclick="setTopicFilter('afterlife', this)">القيامة والمواعظ</button>
        <button class="chip-filter" onclick="setTopicFilter('prophets', this)">قصص الأنبياء</button>
        <button class="chip-filter" onclick="setTopicFilter('tawheed', this)">التوحيد</button>
        <button class="chip-filter" onclick="setTopicFilter('morals', this)">الأخلاق</button>
      </div>

      <div class="memorization-scope-card">
        <div>
          <div class="scope-info-title">
            <span>🛡️</span>
            <span>نطاق وسجل حفظ الإمام</span>
          </div>
          <div id="scopeSummaryText" class="scope-info-sub">المصحف كاملاً</div>
        </div>
        <button class="scope-edit-btn" onclick="openScopeModal()">⚙️ تخصيص الحفظ</button>
      </div>
    </section>

    <section id="cardsFeed"></section>
  </main>

  <!-- نافذة استوديو الحفظ -->
  <div id="scopeModal" class="modal-overlay" onclick="closeScopeModal(event)">
    <div class="scope-modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>تخصيص نطاق حفظ الإمام</div>
        <button onclick="closeScopeModal(null)" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:flex; gap:6px; margin-bottom:8px; overflow-x:auto;">
          <button class="chip-filter" onclick="applyPreset('all')">الكل</button>
          <button class="chip-filter" onclick="applyPreset('amma')">عم (٣٠)</button>
          <button class="chip-filter" onclick="applyPreset('tabarak')">تبارك وعم</button>
          <button class="chip-filter" onclick="applyPreset('clear')">إلغاء</button>
        </div>
        <div id="juzGrid" class="juz-grid-selector"></div>
      </div>
      <div style="padding: 12px; background:var(--bg); border-top:1px solid var(--border-subtle); text-align:center;">
        <button class="confirm-btn" onclick="saveScopeSettings()">اعتماد النطاق ✓</button>
      </div>
    </div>
  </div>

  <!-- متصفح المصحف والكتب -->
  <div id="readerModal" class="reader-modal">
    <div class="reader-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="icon-btn" onclick="toggleMobileIndex()">📑 الفهرس</button>
        <span id="readerTitle" style="font-weight:900; font-size:0.95rem;">المصحف الشريف</span>
      </div>
      <div style="display:flex; gap:4px;">
        <button class="chip-filter" onclick="switchReader('quran')">المصحف</button>
        <button class="chip-filter" onclick="switchReader('shortEasy')">قصار السور</button>
        <button class="chip-filter" onclick="switchReader('mediumSelected')">المطري</button>
      </div>
      <button onclick="closeReaderModal()" style="background:none; border:none; color:#fff; font-size:1.3rem; cursor:pointer;">✕</button>
    </div>
    <div class="reader-layout">
      <aside id="readerSidebar" class="reader-index-sidebar">
        <div style="padding:8px; border-bottom:1px solid var(--border-subtle);">
          <input type="text" class="search-input" placeholder="ابحث في الفهرس..." oninput="filterIndex(this.value)">
        </div>
        <div id="readerIndexList" style="flex:1; overflow-y:auto; padding:6px; display:flex; flex-direction:column; gap:4px;"></div>
      </aside>
      <div class="reader-viewport">
        <div id="mushafFrame" class="mushaf-page-frame" style="width:100%; max-width:760px;"></div>
      </div>
    </div>
  </div>

  <!-- نافذة المحظورات -->
  <div id="lockedModal" class="modal-overlay" onclick="closeLockedModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>المقاطع المحظورة (48 ساعة)</div>
        <button onclick="closeLockedModal(null)" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div id="lockedModalBody" class="modal-body"></div>
      <div style="padding:10px; background:var(--bg); border-top:1px solid var(--border-subtle); text-align:center;">
        <button class="chip-filter" style="color:#D9534F; border-color:#D9534F;" onclick="resetAllCooldowns()">إلغاء حظر الكل</button>
      </div>
    </div>
  </div>

  <script>
    let database = [];
    let selectedPrayer = 'maghrib';
    let selectedBook = 'all';
    let selectedLength = 'all';
    let selectedTopic = 'all';
    let searchQuery = '';
    let selectedJuzs = new Set(Array.from({length: 30}, (_, i) => i + 1));
    let currentReaderSource = 'quran';

    if (localStorage.getItem('mihrab_dark') === 'true') document.body.classList.add('dark-mode');
    if (localStorage.getItem('mihrab_saved_juzs')) {
      selectedJuzs = new Set(JSON.parse(localStorage.getItem('mihrab_saved_juzs')));
    }

    function toAr(n) {
      return String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('mihrab_dark', document.body.classList.contains('dark-mode'));
    }

    function setPrayer(p, btn) {
      selectedPrayer = p;
      btn.parentElement.querySelectorAll('.prayer-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setBookFilter(b, btn) {
      selectedBook = b;
      btn.parentElement.querySelectorAll('.book-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setLengthFilter(l, btn) {
      selectedLength = l;
      btn.parentElement.querySelectorAll('.chip-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setTopicFilter(t, btn) {
      selectedTopic = t;
      btn.parentElement.querySelectorAll('.chip-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      render();
    }

    function isLocked(id) {
      const exp = localStorage.getItem('mihrab_cd_' + id);
      if (!exp) return false;
      if (Date.now() > parseInt(exp)) {
        localStorage.removeItem('mihrab_cd_' + id);
        return false;
      }
      return true;
    }

    function commitRead(id) {
      const exp = Date.now() + (48 * 60 * 60 * 1000);
      localStorage.setItem('mihrab_cd_' + id, exp);
      render();
    }

    function resetAllCooldowns() {
      Object.keys(localStorage).forEach(k => { if(k.startsWith('mihrab_cd_')) localStorage.removeItem(k); });
      closeLockedModal();
      render();
    }

    function openScopeModal() {
      document.getElementById('scopeModal').style.display = 'flex';
      renderJuzGrid();
    }

    function closeScopeModal() {
      document.getElementById('scopeModal').style.display = 'none';
    }

    function renderJuzGrid() {
      const grid = document.getElementById('juzGrid');
      grid.innerHTML = '';
      for (let j = 1; j <= 30; j++) {
        const btn = document.createElement('button');
        btn.className = `juz-btn ${selectedJuzs.has(j) ? 'selected' : ''}`;
        btn.innerText = `جـ ${toAr(j)}`;
        btn.onclick = () => {
          if (selectedJuzs.has(j)) selectedJuzs.delete(j);
          else selectedJuzs.add(j);
          btn.classList.toggle('selected', selectedJuzs.has(j));
        };
        grid.appendChild(btn);
      }
    }

    function applyPreset(p) {
      if (p === 'all') selectedJuzs = new Set(Array.from({length: 30}, (_, i) => i + 1));
      else if (p === 'amma') selectedJuzs = new Set([30]);
      else if (p === 'tabarak') selectedJuzs = new Set([29, 30]);
      else if (p === 'clear') selectedJuzs.clear();
      renderJuzGrid();
    }

    function saveScopeSettings() {
      localStorage.setItem('mihrab_saved_juzs', JSON.stringify(Array.from(selectedJuzs)));
      closeScopeModal();
      document.getElementById('scopeSummaryText').innerText = `مفعل: ${toAr(selectedJuzs.size)} أجزاء`;
      render();
    }

    function openLockedModal() {
      document.getElementById('lockedModal').style.display = 'flex';
      const body = document.getElementById('lockedModalBody');
      body.innerHTML = '';
      const list = database.filter(s => isLocked(s.id));
      if (list.length === 0) {
        body.innerHTML = '<div style="text-align:center; padding:15px; color:var(--text-muted);">لا توجد مقاطع محظورة.</div>';
      } else {
        list.forEach(s => {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:var(--bg); border-radius:8px;';
          row.innerHTML = `<span>سورة ${s.surahName} (${toAr(s.startAyah)}-${toAr(s.endAyah)})</span>
            <button class="chip-filter" onclick="localStorage.removeItem('mihrab_cd_${s.id}'); openLockedModal(); render();">إتاحة</button>`;
          body.appendChild(row);
        });
      }
    }

    function closeLockedModal() {
      document.getElementById('lockedModal').style.display = 'none';
    }

    function openReaderModal(src) {
      document.getElementById('readerModal').style.display = 'flex';
      switchReader(src);
    }

    function closeReaderModal() {
      document.getElementById('readerModal').style.display = 'none';
    }

    function toggleMobileIndex() {
      document.getElementById('readerSidebar').classList.toggle('mobile-open');
    }

    function switchReader(src) {
      currentReaderSource = src;
      const list = document.getElementById('readerIndexList');
      list.innerHTML = '';

      if (src === 'quran') {
        document.getElementById('readerTitle').innerText = 'المصحف الشريف';
        for (let i = 1; i <= 114; i++) {
          const b = document.createElement('button');
          b.className = 'chip-filter';
          b.style.textAlign = 'right';
          b.innerText = `سورة رقم ${toAr(i)}`;
          b.onclick = () => loadSurahReader(i);
          list.appendChild(b);
        }
        loadSurahReader(1);
      } else {
        document.getElementById('readerTitle').innerText = src === 'shortEasy' ? 'قصار السور' : 'آيات مختارة';
        const items = database.filter(d => d.book === src);
        items.forEach((item) => {
          const b = document.createElement('button');
          b.className = 'chip-filter';
          b.style.textAlign = 'right';
          b.innerText = `سورة ${item.surahName} (${toAr(item.startAyah)}-${toAr(item.endAyah)})`;
          b.onclick = () => renderBookItem(item);
          list.appendChild(b);
        });
        if (items.length > 0) renderBookItem(items[0]);
      }
    }

    async function loadSurahReader(num) {
      const frame = document.getElementById('mushafFrame');
      frame.innerHTML = '<div style="text-align:center;">جاري التحميل...</div>';
      try {
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${num}/quran-uthmani`);
        const json = await res.json();
        const s = json.data;
        const text = s.ayahs.map(a => `${a.text} <span class="verse-badge">﴿${toAr(a.numberInSurah)}﴾</span>`).join(' ');
        frame.innerHTML = `<div class="surah-banner">سورة ${s.name}</div>${num !== 9 ? '<div class="basmalah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>' : ''}${text}`;
      } catch (e) {
        frame.innerHTML = '<div style="text-align:center; color:#D9534F;">تأكد من الاتصال بالإنترنت.</div>';
      }
    }

    function renderBookItem(item) {
      const frame = document.getElementById('mushafFrame');
      const text = (item.verses || []).map(v => `${v.text} <span class="verse-badge">﴿${toAr(v.num)}﴾</span>`).join(' ');
      frame.innerHTML = `
        <div class="surah-banner">سورة ${item.surahName} (${toAr(item.startAyah)} - ${toAr(item.endAyah)})</div>
        <div style="text-align:center; color:var(--gold); font-weight:800; margin-bottom:12px;">الموضوع: ${item.theme}</div>
        ${item.startAyah === 1 && item.surahNo !== 9 ? '<div class="basmalah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>' : ''}
        ${text}
        <div class="rakah-box" style="margin-top:16px;">
          📖 دليل الركعتين: الأولى تقف عند آية (${toAr(item.rakah1End)})، والثانية تبدأ من آية (${toAr(item.rakah2Start)}).
        </div>
      `;
    }

    function render() {
      const feed = document.getElementById('cardsFeed');
      feed.innerHTML = '';

      let lockedCount = 0;
      database.forEach(s => { if (isLocked(s.id)) lockedCount++; });
      document.getElementById('cooldownCounter').innerText = `المحظورة (${toAr(lockedCount)})`;

      const seen = new Set();
      const filtered = database.filter(item => {
        if (!selectedJuzs.has(item.juz)) return false;
        if (selectedBook !== 'all' && item.book !== selectedBook) return false;
        if (selectedLength !== 'all' && item.lengthTier !== selectedLength) return false;
        if (selectedTopic !== 'all' && item.topicKey !== selectedTopic) return false;
        if (selectedPrayer === 'maghrib' && item.ayahCount > 8) return false;
        if (isLocked(item.id)) return false;

        if (searchQuery) {
          const inSurah = item.surahName.includes(searchQuery);
          const inVerses = (item.verses || []).some(v => v.text.includes(searchQuery));
          if (!inSurah && !inVerses) return false;
        }

        const key = `${item.book}_${item.surahNo}_${item.startAyah}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      if (filtered.length === 0) {
        feed.innerHTML = '<div class="control-card" style="text-align:center; padding:30px; color:var(--text-muted);">لا توجد مقاطع مطابقة أو جميعها تحت الحظر.</div>';
        return;
      }

      filtered.forEach(sec => {
        const vHtml = (sec.verses || []).map(v => 
          `${v.text} <span class="verse-badge">﴿${toAr(v.num)}﴾</span>`
        ).join(' ');

        const card = document.createElement('article');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-header-bar">
            <div class="surah-info">
              <span class="surah-title">سورة ${sec.surahName}</span>
              <span class="ayat-tag">الآيات (${toAr(sec.startAyah)} - ${toAr(sec.endAyah)})</span>
              <span class="ayat-tag" style="color:var(--gold);">جـ ${toAr(sec.juz)}</span>
            </div>
            <span class="topic-badge">${sec.topicLabel || 'عام'}</span>
          </div>
          <div class="card-content">
            <div style="font-size:0.8rem; color:var(--text-muted); font-weight:700;">المصدر: ${sec.sourceName}</div>
            <div class="quran-text-wrapper">${vHtml}</div>
            <div class="rakah-box">
              <span>📖</span>
              <span>دليل الركعتين: الأولى تقف عند آية (${toAr(sec.rakah1End)})، والثانية تبدأ من آية (${toAr(sec.rakah2Start)}).</span>
            </div>
            <button class="confirm-btn" onclick="commitRead('${sec.id}')">✓ تمت القراءة في الصلاة (حظر 48 ساعة)</button>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    async function init() {
      try {
        const res = await fetch('quran_books.json?v=' + Date.now());
        if (res.ok) database = await res.json();
      } catch (e) {}
      render();
    }

    init();
  </script>
</body>
</html>
