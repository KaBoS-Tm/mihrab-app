<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مِحْرَابُ الإِمَام</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F382A">
  <link rel="stylesheet" href="style.css">
  <script src="fix_text.js"></script>
</head>
<body>

  <header>
    <div class="brand-title">مِحْرَابُ <span>الإِمَام</span></div>
    <div class="top-actions">
      <button class="btn-sm" onclick="toggleDarkMode()">🌙</button>
      <button class="btn-sm" onclick="toggleLayoutMode()" id="layoutToggleBtn">📱 جوال</button>
    </div>
  </header>

  <main class="main-wrapper">
    <!-- قائمة الفلاتر الجانبية / العلوية -->
    <aside class="filters-card">
      <input type="text" id="liveSearch" class="search-box" placeholder="ابحث عن سورة أو كلمة..." oninput="handleSearch(this.value)">

      <div style="font-size:0.8rem; font-weight:800; color:var(--text-muted);">الصلاة:</div>
      <div class="scroll-row">
        <button class="chip" onclick="setPrayer('fajr', this)">الفجر</button>
        <button class="chip" onclick="setPrayer('dhuhr', this)">الظهر</button>
        <button class="chip" onclick="setPrayer('asr', this)">العصر</button>
        <button class="chip active" onclick="setPrayer('maghrib', this)">المغرب</button>
        <button class="chip" onclick="setPrayer('isha', this)">العشاء</button>
      </div>

      <div style="font-size:0.8rem; font-weight:800; color:var(--text-muted);">الكتاب:</div>
      <div class="scroll-row">
        <button class="chip active" onclick="setBook('all', this)">كلاهما</button>
        <button class="chip" onclick="setBook('shortEasy', this)">قصار السور</button>
        <button class="chip" onclick="setBook('mediumSelected', this)">آيات مختارة</button>
      </div>

      <div style="font-size:0.8rem; font-weight:800; color:var(--text-muted);">طول المقطع:</div>
      <div class="scroll-row">
        <button class="chip active" onclick="setLength('all', this)">الكل</button>
        <button class="chip" onclick="setLength('very_short', this)">قصير جداً</button>
        <button class="chip" onclick="setLength('short', this)">قصير</button>
        <button class="chip" onclick="setLength('medium', this)">متوسط</button>
        <button class="chip" onclick="setLength('long', this)">طويل</button>
      </div>
    </aside>

    <!-- مكان عرض البطاقات -->
    <section id="cardsFeed"></section>
  </main>

  <!-- شريط التنقل السفلي المخصص لشاشات الجوال -->
  <nav class="mobile-nav">
    <button class="nav-item active" onclick="window.scrollTo({top:0, behavior:'smooth'})">
      <span>🏠</span><span>المقترح</span>
    </button>
    <button class="nav-item" onclick="alert('سجل الحفظ مفعل تلقائياً')">
      <span>🛡️</span><span>حفظ الإمام</span>
    </button>
    <button class="nav-item" onclick="resetCooldowns()">
      <span>⏳</span><span id="cdCount">المحظور (0)</span>
    </button>
  </nav>

  <script>
    let database = [];
    let selectedPrayer = 'maghrib';
    let selectedBook = 'all';
    let selectedLength = 'all';
    let searchQuery = '';

    if (localStorage.getItem('mihrab_dark') === 'true') document.body.classList.add('dark-mode');

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('mihrab_dark', document.body.classList.contains('dark-mode'));
    }

    function toggleLayoutMode() {
      const btn = document.getElementById('layoutToggleBtn');
      if (document.body.classList.contains('force-desktop')) {
        document.body.classList.remove('force-desktop');
        btn.innerText = '📱 جوال';
      } else {
        document.body.classList.add('force-desktop');
        btn.innerText = '💻 حاسب';
      }
    }

    function setPrayer(p, btn) {
      selectedPrayer = p;
      btn.parentElement.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setBook(b, btn) {
      selectedBook = b;
      btn.parentElement.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setLength(l, btn) {
      selectedLength = l;
      btn.parentElement.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      render();
    }

    function isLocked(id) {
      const exp = localStorage.getItem('mihrab_cd_' + id);
      if (!exp) return false;
      if (Date.now() > parseInt(exp)) {
        localStorage.removeItem('mihrab_cd_' + id);
        return false;
      }
      return true;
    }

    function commitRead(id) {
      const exp = Date.now() + (48 * 60 * 60 * 1000);
      localStorage.setItem('mihrab_cd_' + id, exp);
      render();
    }

    function resetCooldowns() {
      Object.keys(localStorage).forEach(k => { if(k.startsWith('mihrab_cd_')) localStorage.removeItem(k); });
      alert('تم إلغاء حظر جميع المقاطع');
      render();
    }

    async function init() {
      try {
        const res = await fetch('quran_books.json?v=' + Date.now());
        if (res.ok) database = await res.json();
      } catch(e) {}
      render();
    }

    function toArDigits(n) {
      return String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    }

    function render() {
      const feed = document.getElementById('cardsFeed');
      feed.innerHTML = '';

      let lockedCount = 0;
      database.forEach(s => { if (isLocked(s.id)) lockedCount++; });
      document.getElementById('cdCount').innerText = `المحظور (${lockedCount})`;

      const seen = new Set();
      const filtered = database.filter(item => {
        if (selectedBook !== 'all' && item.book !== selectedBook) return false;
        if (selectedLength !== 'all' && item.lengthTier !== selectedLength) return false;
        if (selectedPrayer === 'maghrib' && item.ayahCount > 8) return false;
        if (isLocked(item.id)) return false;

        if (searchQuery) {
          const matchSurah = item.surahName.includes(searchQuery);
          const matchText = (item.verses || []).some(v => v.text.includes(searchQuery));
          if (!matchSurah && !matchText) return false;
        }

        const key = `${item.book}_${item.surahNo}_${item.startAyah}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      if (filtered.length === 0) {
        feed.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">لا توجد مقاطع مطابقة أو جميعها محظورة (48 ساعة).</div>';
        return;
      }

      filtered.forEach(sec => {
        // تمرير النص القرآني عبر دالة المعالجة لمنع تفكك اللام
        const versesHtml = (sec.verses || []).map(v => 
          `${normalizeQuranText(v.text)} <span class="ayah-num">﴿${toArDigits(v.num)}﴾</span>`
        ).join(' ');

        const card = document.createElement('article');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-header">
            <span style="font-weight:900; color:var(--primary);">سورة ${sec.surahName} (${toArDigits(sec.startAyah)}-${toArDigits(sec.endAyah)})</span>
            <span style="font-size:0.78rem; font-weight:700; color:var(--gold);">${sec.sourceName}</span>
          </div>
          <div class="card-body">
            <div class="quran-text">${versesHtml}</div>
            <div class="rakah-guide">
              📖 دليل الركعتين: الأولى تقف عند آية (${toArDigits(sec.rakah1End)})، والثانية تبدأ من آية (${toArDigits(sec.rakah2Start)}).
            </div>
            <button class="btn-confirm" onclick="commitRead('${sec.id}')">✓ تمت القراءة في الصلاة (حظر 48 ساعة)</button>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
