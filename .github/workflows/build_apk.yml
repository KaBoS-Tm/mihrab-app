name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Rebuild Clean Android Project
        run: |
          # حذف أي ملفات أندرويد قديمة أو ناقصة
          rm -rf android
          
          # إعادة توليد مجلد أندرويد بهيكل حديث متوافق تماماً
          flutter create . --org com.mihrab.app --platforms android
          
          # تثبيت الحزم
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mihrab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
