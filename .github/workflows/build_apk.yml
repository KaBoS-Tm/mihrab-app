name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Project and Configure Kotlin
        run: |
          # 1. حفظ ملفات المشروع الأساسية
          mkdir -p /tmp/app_src
          cp -r lib assets pubspec.yaml /tmp/app_src/

          # 2. إنشاء بيئة عمل أندرويد رسمية
          cd $RUNNER_TEMP
          rm -rf mihrab_workspace
          flutter create mihrab_workspace --org com.mihrab.app --platforms android
          cd mihrab_workspace

          # 3. دمج ملفات التطبيق الخاصة بنا
          rm -rf lib assets pubspec.yaml
          cp -r /tmp/app_src/* .

          # 4. ترقية إصدار Kotlin إلى الإصدار المتوافق مع حزمة shared_preferences
          # تعديل settings.gradle إذا كان المشروع يستخدم الصيغة الجديدة
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          fi

          # تعديل build.gradle إذا كان المشروع يستخدم الصيغة السابقة
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/g' android/build.gradle
          fi

          # 5. جلب الحزم وبناء تطبيق أندرويد النهائي
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

          # 6. نقل الـ APK المكتمل لمسار الرفع
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihrab-release-apk
          path: output/app-release.apk
