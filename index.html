<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مِحْرَابُ الإِمَام | رفيق التلاوة والوقف</title>
  
  <!-- خطوط عربية فاخرة ومصحفية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0F382A;           /* أخضر ملكي عميق */
      --primary-light: #18533E;
      --gold: #C5A059;              /* ذهبي مصحفي معتق */
      --gold-light: #DFCA95;
      --gold-glow: rgba(197, 160, 89, 0.25);
      --bg: #F7F5EE;                /* ورق مصحفي عاجي مريح */
      --card-bg: #FFFFFF;
      --text-main: #19221E;
      --text-muted: #5D6B64;
      --border-subtle: #E8E2D2;
      --border-gold: rgba(197, 160, 89, 0.45);
      --shadow-sm: 0 4px 12px rgba(15, 56, 42, 0.04);
      --shadow-lg: 0 12px 32px rgba(15, 56, 42, 0.1);
      --radius: 18px;
      --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background: linear-gradient(135deg, #0B2B20 0%, var(--primary) 100%);
      color: #fff;
      padding: 24px 20px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }

    .header-content {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-box {
      text-align: right;
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
    }

    .brand-title span.accent {
      color: var(--gold-light);
    }

    .brand-desc {
      font-size: 0.82rem;
      color: #D6CFBE;
      margin-top: 2px;
      font-weight: 500;
    }

    .cooldown-pill-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--gold);
      color: #FFFFFF;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      backdrop-filter: blur(4px);
    }

    .cooldown-pill-btn:hover {
      background: var(--gold);
      color: var(--primary);
    }

    .container {
      width: 100%;
      max-width: 760px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-subtle);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .prayers-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .prayer-btn {
      background: var(--bg);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 10px 4px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .prayer-btn:active {
      transform: scale(0.96);
    }

    .prayer-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--gold);
      box-shadow: 0 4px 14px rgba(15, 56, 42, 0.3);
    }

    .books-selector-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .book-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--bg);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border-subtle);
      gap: 4px;
    }

    .book-tab-btn {
      background: transparent;
      border: none;
      padding: 10px 8px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .book-tab-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border-gold);
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--primary);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type=range] {
      flex: 1;
      height: 6px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .card-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1.5px solid var(--border-gold);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 8px;
      transition: transform 0.35s ease, opacity 0.35s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .card-item:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .card-header-bar {
      background: linear-gradient(90deg, #F9F7F1 0%, #F3EFE4 100%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .surah-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .surah-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--primary);
    }

    .ayat-tag {
      background: #EAE4D5;
      color: #4C5952;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .source-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-gold);
      background: #FFFAF0;
      color: #8C6627;
    }

    .card-content {
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .theme-statement {
      background: #FAF8F2;
      border-right: 4px solid var(--gold);
      padding: 10px 14px;
      border-radius: 4px 10px 10px 4px;
      font-size: 0.94rem;
      color: var(--text-muted);
      line-height: 1.5;
      font-weight: 600;
    }

    .quran-text-wrapper {
      background: #FFFEFA;
      border: 1.5px solid #EBE5D8;
      border-radius: 14px;
      padding: 24px 18px;
      text-align: justify;
      text-align-last: center;
      line-height: 2.7;
      font-family: 'Amiri Quran', serif;
      font-size: 1.5rem;
      color: #16201B;
      position: relative;
    }

    .verse-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-family: 'Amiri Quran', serif;
      font-size: 1.35rem;
      margin: 0 5px;
      font-weight: bold;
      user-select: none;
    }

    .rakah-box {
      background: #EFF7F2;
      border: 1.2px solid #BFDFCD;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .confirm-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--gold) 0%, #A8833A 100%);
      color: #FFFFFF;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--gold-glow);
      transition: var(--transition);
    }

    .confirm-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(197, 160, 89, 0.45);
    }

    .confirm-btn:active {
      transform: scale(0.98);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      border-radius: var(--radius);
      border: 1px solid var(--border-gold);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalPop 0.25s ease-out;
    }

    @keyframes modalPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      padding: 16px 20px;
      background: var(--primary);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .locked-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .unlock-single-btn {
      background: transparent;
      border: 1px solid #D9534F;
      color: #D9534F;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      background: var(--primary);
      color: #FFFFFF;
      border: 1px solid var(--gold);
      padding: 14px 22px;
      border-radius: 30px;
      box-shadow: var(--shadow-lg);
      font-size: 0.92rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2000;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .empty-state {
      background: var(--card-bg);
      border: 1.5px dashed var(--border-subtle);
      border-radius: var(--radius);
      padding: 45px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="brand-box">
        <div class="brand-title">مِحْرَابُ <span class="accent">الإِمَام</span></div>
        <div class="brand-desc">معين الإمام لتنويع التلاوة وضبط مقاطع الصلوات الجهرية</div>
      </div>
      <button class="cooldown-pill-btn" onclick="openLockedModal()">
        <span>⏳</span>
        <span id="cooldownCounter">المحظورة (0)</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="control-card">
      <div class="prayers-grid">
        <button class="prayer-btn" onclick="setPrayer('fajr', this)">الفجر</button>
        <button class="prayer-btn" onclick="setPrayer('dhuhr', this)">الظهر</button>
        <button class="prayer-btn" onclick="setPrayer('asr', this)">العصر</button>
        <button class="prayer-btn active" onclick="setPrayer('maghrib', this)">المغرب</button>
        <button class="prayer-btn" onclick="setPrayer('isha', this)">العشاء</button>
      </div>

      <div class="books-selector-wrap">
        <div class="book-tabs">
          <button class="book-tab-btn" onclick="setBookFilter('shortEasy', this)">📖 كتاب قصار السور</button>
          <button class="book-tab-btn" onclick="setBookFilter('mediumSelected', this)">📚 كتاب الشيخ المطري</button>
          <button class="book-tab-btn active" onclick="setBookFilter('all', this)">✨ كلاهما معاً (اقتراح ذكي)</button>
        </div>
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <span>أقصى جزء محفوظ:</span>
          <span id="juzDisplay" style="color:var(--gold); font-size: 0.95rem;">الجزء 30</span>
        </div>
        <div class="slider-container">
          <span style="font-size:0.8rem; font-weight:700; color:var(--text-muted);">1</span>
          <input type="range" id="juzSlider" min="1" max="30" value="30" oninput="setJuz(this.value)">
          <span style="font-size:0.8rem; font-weight:700; color:var(--text-muted);">30</span>
        </div>
      </div>
    </section>

    <section id="cardsFeed"></section>
  </main>

  <div id="lockedModal" class="modal-overlay" onclick="closeLockedModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div style="font-weight: 800; font-size: 1rem;">المقاطع المحظورة مؤقتاً (48 ساعة)</div>
        <button onclick="closeLockedModal(null)" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div id="lockedModalBody" class="modal-body"></div>
      <div style="padding: 12px; background:#FAF8F2; border-top:1px solid #EBE5D8; text-align:center;">
        <button onclick="resetAllCooldowns()" style="background:#D9534F; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:0.85rem;">
          إلغاء حظر كافة المقاطع فوراً
        </button>
      </div>
    </div>
  </div>

  <div id="toastMessage" class="toast">
    <span>✓</span>
    <span id="toastText">تقبل الله صلاتكم! تم استبعاد المقطع لمدة 48 ساعة.</span>
  </div>

  <script>
    // قاعدة بيانات احتياطية تعمل في حال تأخر تحميل الملف
    const fallbackData = [
      {
        id: "fb_fatiha",
        book: "shortEasy",
        sourceName: "كتاب الآيات القصيرة",
        surahName: "الفاتحة",
        surahNo: 1,
        startAyah: 1,
        endAyah: 7,
        juz: 1,
        theme: "أم القرآن: الثناء التام وطلب الاستقامة على الصراط",
        rakah1End: 4,
        rakah2Start: 5,
        verses: [
          { num: 1, text: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ" },
          { num: 2, text: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ" },
          { num: 3, text: "الرَّحْمَٰنِ الرَّحِيمِ" },
          { num: 4, text: "مَالِكِ يَوْمِ الدِّينِ" },
          { num: 5, text: "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ" },
          { num: 6, text: "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ" },
          { num: 7, text: "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ" }
        ]
      },
      {
        id: "fb_kursi",
        book: "mediumSelected",
        sourceName: "الشيخ محمد المطري",
        surahName: "البقرة",
        surahNo: 2,
        startAyah: 255,
        endAyah: 257,
        juz: 3,
        theme: "آية الكرسي العظمى وولاية الله للمؤمنين",
        rakah1End: 255,
        rakah2Start: 256,
        verses: [
          { num: 255, text: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ" },
          { num: 256, text: "لَا إِكْرَاهَ فِي الدِّينِ ۖ قَد تَّبَيَّنَ الرُّشْدُ مِنَ الْغَيِّ ۚ فَمَن يَكْفُرْ بِالطَّاغُوتِ وَيُؤْمِن بِاللَّهِ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ لَا انفِصَامَ لَهَا ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ" },
          { num: 257, text: "اللَّهُ وَلِيُّ الَّذِينَ آمَنُوا يُخْرِجُهُم مِّنَ الظُّلُمَاتِ إِلَى النُّورِ ۖ وَالَّذِينَ كَفَرُوا أَوْلِيَاؤُهُمُ الطَّاغُوتُ يُخْرِجُونَهُم مِّنَ النُّورِ إِلَى الظُّلُمَاتِ ۗ أُولَٰئِكَ أَصْحَابُ النَّارِ ۖ هُمْ فِيهَا خَالِدُونَ" }
        ]
      }
    ];

    let database = [];
    let selectedPrayer = 'maghrib';
    let selectedBook = 'all';
    let maxJuz = 30;

    // جلب ملف quran_books.json الذي ولّده البوت سحابياً
    async function initDatabase() {
      try {
        const response = await fetch('quran_books.json?v=' + Date.now());
        if (response.ok) {
          database = await response.json();
        } else {
          database = fallbackData;
        }
      } catch (e) {
        database = fallbackData;
      }
      render();
    }

    function toArabicDigits(num) {
      return String(num).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    }

    function setPrayer(p, btn) {
      selectedPrayer = p;
      document.querySelectorAll('.prayer-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setBookFilter(b, btn) {
      selectedBook = b;
      document.querySelectorAll('.book-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setJuz(val) {
      maxJuz = parseInt(val);
      document.getElementById('juzDisplay').innerText = `الجزء ${val}`;
      render();
    }

    function isLocked(id) {
      const exp = localStorage.getItem('mihrab_cd_' + id);
      if (!exp) return false;
      if (Date.now() > parseInt(exp)) {
        localStorage.removeItem('mihrab_cd_' + id);
        return false;
      }
      return true;
    }

    function updateCooldownCounter() {
      let count = 0;
      database.forEach(sec => {
        if (isLocked(sec.id)) count++;
      });
      document.getElementById('cooldownCounter').innerText = `المحظورة (${count})`;
    }

    function commitRead(id, btnElement) {
      const card = btnElement.closest('.card-item');
      card.style.transform = 'scale(0.95)';
      card.style.opacity = '0';

      setTimeout(() => {
        const cooldownHours = 48;
        const expireTime = Date.now() + (cooldownHours * 60 * 60 * 1000);
        localStorage.setItem('mihrab_cd_' + id, expireTime);
        showToast('تقبل الله صلاتكم! تم استبعاد المقطع لمدة 48 ساعة.');
        render();
      }, 300);
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      document.getElementById('toastText').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function openLockedModal() {
      const modal = document.getElementById('lockedModal');
      const body = document.getElementById('lockedModalBody');
      body.innerHTML = '';

      const lockedList = database.filter(s => isLocked(s.id));
      if (lockedList.length === 0) {
        body.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">لا توجد أي مقاطع محظورة حالياً. جميع الآيات متاحة للعرض.</div>';
      } else {
        lockedList.forEach(s => {
          const exp = parseInt(localStorage.getItem('mihrab_cd_' + s.id));
          const hoursLeft = Math.max(1, Math.round((exp - Date.now()) / (1000 * 60 * 60)));
          const row = document.createElement('div');
          row.className = 'locked-item-row';
          row.innerHTML = `
            <div>
              <div style="font-weight:800; color:var(--primary);">سورة ${s.surahName} (${s.startAyah} - ${s.endAyah})</div>
              <div style="font-size:0.75rem; color:var(--text-muted);">متبقي في الحظر: قرابة ${hoursLeft} ساعة</div>
            </div>
            <button class="unlock-single-btn" onclick="unlockSingle('${s.id}')">إتاحة الآن</button>
          `;
          body.appendChild(row);
        });
      }

      modal.style.display = 'flex';
    }

    function closeLockedModal(e) {
      document.getElementById('lockedModal').style.display = 'none';
    }

    function unlockSingle(id) {
      localStorage.removeItem('mihrab_cd_' + id);
      openLockedModal();
      render();
    }

    function resetAllCooldowns() {
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith('mihrab_cd_')) localStorage.removeItem(key);
      });
      closeLockedModal();
      showToast('تمت إعادة إتاحة كافة المقاطع بنجاح.');
      render();
    }

    function render() {
      const feed = document.getElementById('cardsFeed');
      feed.innerHTML = '';
      updateCooldownCounter();

      const filtered = database.filter(item => {
        if (item.juz > maxJuz) return false;
        if (selectedBook !== 'all' && item.book !== selectedBook) return false;
        if (selectedPrayer === 'maghrib' && item.verses && item.verses.length > 8) return false;
        if (isLocked(item.id)) return false;
        return true;
      });

      if (filtered.length === 0) {
        feed.innerHTML = `
          <div class="empty-state">
            <span style="font-size: 2.6rem;">⏳</span>
            <h3 style="color:var(--primary); font-weight:800;">لا توجد مقاطع متوفرة حالياً</h3>
            <p style="color:var(--text-muted); font-size:0.9rem; max-width:420px; line-height:1.6;">
              المقاطع في هذا النطاق تحت حظر الـ 48 ساعة أو خارج نطاق الحفظ المحدد. يمكنك مراجعة المحظورات أو إلغاء الحظر مؤقتاً.
            </p>
            <button class="confirm-btn" style="width:auto; padding:10px 24px;" onclick="resetAllCooldowns()">
              إعادة إتاحة المقاطع فوراً
            </button>
          </div>
        `;
        return;
      }

      filtered.forEach(sec => {
        const versesHtml = (sec.verses || []).map(v => 
          `${v.text} <span class="verse-badge">﴿${toArabicDigits(v.num)}﴾</span>`
        ).join(' ');

        const card = document.createElement('article');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-header-bar">
            <div class="surah-info">
              <span class="surah-title">سورة ${sec.surahName}</span>
              <span class="ayat-tag">الآيات (${toArabicDigits(sec.startAyah)} - ${toArabicDigits(sec.endAyah)})</span>
            </div>
            <span class="source-badge">${sec.sourceName}</span>
          </div>

          <div class="card-content">
            <div class="theme-statement">${sec.theme}</div>
            <div class="quran-text-wrapper">${versesHtml}</div>
            
            <div class="rakah-box">
              <span>📖</span>
              <span>دليل الركعتين: الأولى تقف عند آية (${toArabicDigits(sec.rakah1End)})، والثانية تبدأ من آية (${toArabicDigits(sec.rakah2Start)}).</span>
            </div>

            <button class="confirm-btn" onclick="commitRead('${sec.id}', this)">
              <span>✓</span>
              <span>تمت القراءة في الصلاة (حظر 48 ساعة)</span>
            </button>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    // بدء تشغيل التطبيق وجلب البيانات
    initDatabase();
  </script>
</body>
</html>
