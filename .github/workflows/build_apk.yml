name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build Project in Clean Scaffold
        run: |
          # 1. حفظ ملفاتنا البرمجية والأصول في مجلد مؤقت
          mkdir /tmp/user_code
          cp -r lib assets pubspec.yaml /tmp/user_code/

          # 2. إنشاء مشروع فلاتر كامل وجديد متوافق تماماً
          cd ..
          rm -rf workspace
          flutter create workspace --org com.mihrab.app --platforms android
          cd workspace

          # 3. إعادة ملفاتنا (الكود والأصول والـ pubspec) إلى المشروع الجديد
          cp /tmp/user_code/pubspec.yaml .
          rm -rf lib assets
          cp -r /tmp/user_code/lib .
          cp -r /tmp/user_code/assets .

          # 4. جلب الحزم وبناء الـ APK
          flutter pub get
          flutter build apk --release

          # 5. تجهيز مكان الملف النهائي لرفعه
          mkdir -p $GITHUB_WORKSPACE/build_output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihrab-release-apk
          path: build_output/app-release.apk
