<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مِحْرَابُ الإِمَام | رفيق التلاوة والوقف</title>
  
  <!-- خطوط عربية فاخرة ومصحفية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0F382A;           /* أخضر ملكي عميق */
      --primary-light: #18533E;
      --gold: #C5A059;              /* ذهبي معتق */
      --gold-light: #DFCA95;
      --gold-glow: rgba(197, 160, 89, 0.25);
      --bg: #F7F5EE;                /* ورق مصحفي عاجي مريح */
      --card-bg: #FFFFFF;
      --text-main: #19221E;
      --text-muted: #5D6B64;
      --border-subtle: #E8E2D2;
      --border-gold: rgba(197, 160, 89, 0.45);
      --shadow-sm: 0 4px 14px rgba(15, 56, 42, 0.05);
      --shadow-lg: 0 12px 32px rgba(15, 56, 42, 0.12);
      --radius: 18px;
      --transition: all 0.25s ease;
      --quran-font-size: 1.55rem;
    }

    body.dark-mode {
      --primary: #174233;
      --primary-light: #215945;
      --gold: #D6B26B;
      --gold-light: #F0DFC0;
      --gold-glow: rgba(214, 178, 107, 0.2);
      --bg: #0C1512;                /* داكن مصحفي فخم ومريح للعين ليلاً */
      --card-bg: #141F1B;
      --text-main: #E9ECE9;
      --text-muted: #9EAEA6;
      --border-subtle: #24352D;
      --border-gold: rgba(214, 178, 107, 0.35);
      --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 70px;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      width: 100%;
      background: linear-gradient(135deg, #071D15 0%, var(--primary) 100%);
      color: #fff;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    }

    .header-content {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.55rem;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }

    .brand-title span.accent {
      color: var(--gold-light);
    }

    .brand-desc {
      font-size: 0.8rem;
      color: #D6CFBE;
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--border-gold);
      color: #FFFFFF;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.05rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: var(--transition);
      backdrop-filter: blur(4px);
    }

    .icon-btn:hover {
      background: var(--gold);
      color: var(--primary);
    }

    .cooldown-pill-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--gold);
      color: #FFFFFF;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
    }

    .container {
      width: 100%;
      max-width: 820px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-subtle);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-input-wrap {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 12px 42px 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-subtle);
      background: var(--bg);
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .prayers-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .prayer-btn {
      background: var(--bg);
      border: 1.5px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 9px 4px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .prayer-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--gold);
      box-shadow: 0 4px 12px rgba(15, 56, 42, 0.25);
    }

    .book-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--bg);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border-subtle);
      gap: 4px;
    }

    .book-tab-btn {
      background: transparent;
      border: none;
      padding: 9px 6px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      font-weight: 800;
      border: 1px solid var(--border-gold);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    body.dark-mode .book-tab-btn.active {
      color: var(--gold);
    }

    .horizontal-scroll-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .horizontal-scroll-filters::-webkit-scrollbar { display: none; }

    .chip-filter {
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition);
    }

    .chip-filter.active {
      background: var(--gold);
      color: #0F382A;
      font-weight: 800;
      border-color: var(--gold);
    }

    .custom-scope-box {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid var(--border-subtle);
    }

    .scope-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--primary);
    }

    body.dark-mode .scope-header {
      color: var(--gold);
    }

    .scope-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scope-slider {
      flex: 1;
      height: 6px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .card-item {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1.5px solid var(--border-gold);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 14px;
      transition: var(--transition);
      position: relative;
    }

    .card-header-bar {
      background: rgba(197, 160, 89, 0.08);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .surah-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .surah-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--primary);
    }

    body.dark-mode .surah-title {
      color: var(--gold);
    }

    .ayat-tag {
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topic-badge {
      font-size: 0.74rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(15, 56, 42, 0.08);
      color: var(--primary);
      border: 1px solid var(--border-subtle);
    }

    body.dark-mode .topic-badge {
      background: rgba(214, 178, 107, 0.12);
      color: var(--gold-light);
    }

    .fav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.15rem;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .fav-btn.active {
      color: #E67E22;
    }

    .card-content {
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .quran-text-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 24px 18px;
      text-align: justify;
      text-align-last: center;
      line-height: 2.8;
      font-family: 'Amiri Quran', serif;
      font-size: var(--quran-font-size);
      color: var(--text-main);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .verse-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-family: 'Amiri Quran', serif;
      font-size: 1.35rem;
      margin: 0 4px;
      font-weight: bold;
      user-select: none;
    }

    .rakah-box {
      background: rgba(15, 56, 42, 0.05);
      border: 1.2px solid rgba(15, 56, 42, 0.15);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    body.dark-mode .rakah-box {
      background: rgba(214, 178, 107, 0.08);
      border-color: rgba(214, 178, 107, 0.25);
      color: var(--gold-light);
    }

    .confirm-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--gold) 0%, #A8833A 100%);
      color: #FFFFFF;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--gold-glow);
      transition: var(--transition);
    }

    .confirm-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(197, 160, 89, 0.4);
    }

    .confirm-btn:active {
      transform: scale(0.98);
    }

    .font-size-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      max-height: 82vh;
      border-radius: var(--radius);
      border: 1px solid var(--border-gold);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      background: var(--primary);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .locked-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      background: var(--primary);
      color: #FFFFFF;
      border: 1px solid var(--gold);
      padding: 14px 22px;
      border-radius: 30px;
      box-shadow: var(--shadow-lg);
      font-size: 0.92rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2000;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .empty-state {
      background: var(--card-bg);
      border: 1.5px dashed var(--border-subtle);
      border-radius: var(--radius);
      padding: 45px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="brand-box">
        <div class="brand-title">مِحْرَابُ <span class="accent">الإِمَام</span></div>
        <div class="brand-desc">معين الإمام لتنويع التلاوة وضبط مقاطع الصلوات الجهرية</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleDarkMode()" title="وضع المحراب الليلي">🌙</button>
        <button class="cooldown-pill-btn" onclick="openLockedModal()">
          <span>⏳</span>
          <span id="cooldownCounter">المحظورة (0)</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="control-card">
      
      <!-- شريط البحث الفوري -->
      <div class="search-input-wrap">
        <input type="text" id="liveSearch" class="search-input" placeholder="ابحث عن سورة، أو كلمة، أو موضوع..." oninput="handleSearch(this.value)">
        <span class="search-icon">🔍</span>
      </div>

      <!-- اختيار الصلاة -->
      <div class="prayers-grid">
        <button class="prayer-btn" onclick="setPrayer('fajr', this)">الفجر</button>
        <button class="prayer-btn" onclick="setPrayer('dhuhr', this)">الظهر</button>
        <button class="prayer-btn" onclick="setPrayer('asr', this)">العصر</button>
        <button class="prayer-btn active" onclick="setPrayer('maghrib', this)">المغرب</button>
        <button class="prayer-btn" onclick="setPrayer('isha', this)">العشاء</button>
      </div>

      <!-- تبويب الكتب بالتسميات الرسمية -->
      <div class="book-tabs">
        <button class="book-tab-btn" onclick="setBookFilter('shortEasy', this)">📖 قـصـار السور</button>
        <button class="book-tab-btn" onclick="setBookFilter('mediumSelected', this)">📚 آيات وسور مختارة</button>
        <button class="book-tab-btn active" onclick="setBookFilter('all', this)">✨ كلاهما معاً</button>
      </div>

      <!-- فلتر أطوال التلاوة الشرعية -->
      <div>
        <div style="font-size:0.8rem; font-weight:800; color:var(--text-muted); margin-bottom:6px;">طول المقطع الشرعي:</div>
        <div class="horizontal-scroll-filters">
          <button class="chip-filter active" onclick="setLengthFilter('all', this)">الكل</button>
          <button class="chip-filter" onclick="setLengthFilter('very_short', this)">قصير جداً (أقله ٣ آيات)</button>
          <button class="chip-filter" onclick="setLengthFilter('short', this)">قصير (٤-٧ آيات)</button>
          <button class="chip-filter" onclick="setLengthFilter('medium', this)">متوسط (٨-١٥ آية)</button>
          <button class="chip-filter" onclick="setLengthFilter('long', this)">طويل (١٦+ آية)</button>
        </div>
      </div>

      <!-- فلتر التصنيف الموضوعي -->
      <div>
        <div style="font-size:0.8rem; font-weight:800; color:var(--text-muted); margin-bottom:6px;">الموضوع والسياق:</div>
        <div class="horizontal-scroll-filters">
          <button class="chip-filter active" onclick="setTopicFilter('all', this)">كافة الموضوعات</button>
          <button class="chip-filter" onclick="setTopicFilter('paradise', this)">نعيم الجنة والرضوان</button>
          <button class="chip-filter" onclick="setTopicFilter('afterlife', this)">أهوال القيامة والمواعظ</button>
          <button class="chip-filter" onclick="setTopicFilter('prophets', this)">قصص الأنبياء والعِبر</button>
          <button class="chip-filter" onclick="setTopicFilter('tawheed', this)">التوحيد وعظمة الخالق</button>
          <button class="chip-filter" onclick="setTopicFilter('morals', this)">الأخلاق والمعاملات</button>
        </div>
      </div>

      <!-- نطاق حفظ الإمام المخصص -->
      <div class="custom-scope-box">
        <div class="scope-header">
          <span>نطاق حفظ الإمام (المقترح يبدأ مما تحفظ):</span>
          <span id="scopeDisplay" style="color:var(--gold);">من الجزء ١ إلى ٣٠</span>
        </div>
        <div class="scope-controls">
          <span style="font-size:0.78rem; font-weight:800;">جزء:</span>
          <input type="range" class="scope-slider" id="scopeSliderMin" min="1" max="30" value="1" oninput="updateScope()">
          <span style="font-size:0.78rem; font-weight:800;">إلى:</span>
          <input type="range" class="scope-slider" id="scopeSliderMax" min="1" max="30" value="30" oninput="updateScope()">
        </div>
      </div>

      <!-- أدوات الخط والمفضلة -->
      <div class="font-size-bar">
        <span>حجم خط المصحف:</span>
        <div style="display:flex; gap:6px;">
          <button class="chip-filter" onclick="changeFontSize(-0.15)">- تصغير</button>
          <button class="chip-filter" onclick="changeFontSize(0.15)">+ تكبير</button>
          <button class="chip-filter" id="favFilterBtn" onclick="toggleFavFilter(this)">⭐ المفضلة فقط</button>
        </div>
      </div>

    </section>

    <!-- قائمة عرض المقاطع -->
    <section id="cardsFeed"></section>
  </main>

  <!-- نافذة المحظورات 48 ساعة -->
  <div id="lockedModal" class="modal-overlay" onclick="closeLockedModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div style="font-weight: 800; font-size: 1rem;">المقاطع المحظورة مؤقتاً (48 ساعة)</div>
        <button onclick="closeLockedModal(null)" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div id="lockedModalBody" class="modal-body"></div>
      <div style="padding: 12px; background:var(--bg); border-top:1px solid var(--border-subtle); text-align:center;">
        <button onclick="resetAllCooldowns()" style="background:#D9534F; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:0.85rem;">
          إلغاء حظر كافة المقاطع فوراً
        </button>
      </div>
    </div>
  </div>

  <!-- رسالة التنبيه العائمة -->
  <div id="toastMessage" class="toast">
    <span>✓</span>
    <span id="toastText">تقبل الله صلاتكم! تم استبعاد المقطع لمدة 48 ساعة.</span>
  </div>

  <script>
    let database = [];
    let selectedPrayer = 'maghrib';
    let selectedBook = 'all';
    let selectedLength = 'all';
    let selectedTopic = 'all';
    let searchQuery = '';
    let scopeMin = 1;
    let scopeMax = 30;
    let showFavsOnly = false;
    let currentFontSizeRem = 1.55;

    // استرجاع الإعدادات المحفوظة
    if (localStorage.getItem('mihrab_dark') === 'true') {
      document.body.classList.add('dark-mode');
    }
    if (localStorage.getItem('mihrab_scope_min')) {
      scopeMin = parseInt(localStorage.getItem('mihrab_scope_min'));
      scopeMax = parseInt(localStorage.getItem('mihrab_scope_max'));
      document.getElementById('scopeSliderMin').value = scopeMin;
      document.getElementById('scopeSliderMax').value = scopeMax;
    }

    async function initDatabase() {
      try {
        const response = await fetch('quran_books.json?v=' + Date.now());
        if (response.ok) {
          database = await response.json();
        }
      } catch (e) {
        console.warn('تعذر تحميل قاعدة البيانات الخارجية');
      }
      updateScopeDisplay();
      render();
    }

    function toArabicDigits(num) {
      return String(num).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('mihrab_dark', document.body.classList.contains('dark-mode'));
    }

    function changeFontSize(delta) {
      currentFontSizeRem = Math.max(1.2, Math.min(2.4, currentFontSizeRem + delta));
      document.documentElement.style.setProperty('--quran-font-size', currentFontSizeRem + 'rem');
    }

    function setPrayer(p, btn) {
      selectedPrayer = p;
      document.querySelectorAll('.prayer-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setBookFilter(b, btn) {
      selectedBook = b;
      document.querySelectorAll('.book-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setLengthFilter(l, btn) {
      selectedLength = l;
      btn.parentElement.querySelectorAll('.chip-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setTopicFilter(t, btn) {
      selectedTopic = t;
      btn.parentElement.querySelectorAll('.chip-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      render();
    }

    function updateScope() {
      let minVal = parseInt(document.getElementById('scopeSliderMin').value);
      let maxVal = parseInt(document.getElementById('scopeSliderMax').value);
      if (minVal > maxVal) {
        const temp = minVal; minVal = maxVal; maxVal = temp;
      }
      scopeMin = minVal;
      scopeMax = maxVal;
      localStorage.setItem('mihrab_scope_min', scopeMin);
      localStorage.setItem('mihrab_scope_max', scopeMax);
      updateScopeDisplay();
      render();
    }

    function updateScopeDisplay() {
      document.getElementById('scopeDisplay').innerText = `من الجزء ${toArabicDigits(scopeMin)} إلى ${toArabicDigits(scopeMax)}`;
    }

    function toggleFav(id, btn) {
      const favKey = 'mihrab_fav_' + id;
      if (localStorage.getItem(favKey)) {
        localStorage.removeItem(favKey);
        btn.classList.remove('active');
        btn.innerText = '☆';
        showToast('تمت الإزالة من المفضلة');
      } else {
        localStorage.setItem(favKey, 'true');
        btn.classList.add('active');
        btn.innerText = '★';
        showToast('تمت الإضافة إلى مفضلة الإمام ⭐');
      }
      if (showFavsOnly) render();
    }

    function toggleFavFilter(btn) {
      showFavsOnly = !showFavsOnly;
      btn.classList.toggle('active', showFavsOnly);
      render();
    }

    function isLocked(id) {
      const exp = localStorage.getItem('mihrab_cd_' + id);
      if (!exp) return false;
      if (Date.now() > parseInt(exp)) {
        localStorage.removeItem('mihrab_cd_' + id);
        return false;
      }
      return true;
    }

    function updateCooldownCounter() {
      let count = 0;
      database.forEach(sec => {
        if (isLocked(sec.id)) count++;
      });
      document.getElementById('cooldownCounter').innerText = `المحظورة (${count})`;
    }

    function commitRead(id, btnElement) {
      const card = btnElement.closest('.card-item');
      card.style.transform = 'scale(0.95)';
      card.style.opacity = '0';

      setTimeout(() => {
        const cooldownHours = 48;
        const expireTime = Date.now() + (cooldownHours * 60 * 60 * 1000);
        localStorage.setItem('mihrab_cd_' + id, expireTime);
        showToast('تقبل الله صلاتكم! تم استبعاد المقطع لمدة 48 ساعة.');
        render();
      }, 260);
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      document.getElementById('toastText').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3200);
    }

    function openLockedModal() {
      const modal = document.getElementById('lockedModal');
      const body = document.getElementById('lockedModalBody');
      body.innerHTML = '';

      const lockedList = database.filter(s => isLocked(s.id));
      if (lockedList.length === 0) {
        body.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">لا توجد أي مقاطع محظورة حالياً. جميع الآيات متاحة للعرض.</div>';
      } else {
        lockedList.forEach(s => {
          const exp = parseInt(localStorage.getItem('mihrab_cd_' + s.id));
          const hoursLeft = Math.max(1, Math.round((exp - Date.now()) / (1000 * 60 * 60)));
          const row = document.createElement('div');
          row.className = 'locked-item-row';
          row.innerHTML = `
            <div>
              <div style="font-weight:800; color:var(--primary);">سورة ${s.surahName} (${toArabicDigits(s.startAyah)} - ${toArabicDigits(s.endAyah)})</div>
              <div style="font-size:0.75rem; color:var(--text-muted);">متبقي في الحظر: قرابة ${hoursLeft} ساعة</div>
            </div>
            <button class="chip-filter" style="border-color:#D9534F; color:#D9534F;" onclick="unlockSingle('${s.id}')">إتاحة الآن</button>
          `;
          body.appendChild(row);
        });
      }
      modal.style.display = 'flex';
    }

    function closeLockedModal(e) {
      document.getElementById('lockedModal').style.display = 'none';
    }

    function unlockSingle(id) {
      localStorage.removeItem('mihrab_cd_' + id);
      openLockedModal();
      render();
    }

    function resetAllCooldowns() {
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith('mihrab_cd_')) localStorage.removeItem(key);
      });
      closeLockedModal();
      showToast('تمت إعادة إتاحة كافة المقاطع بنجاح.');
      render();
    }

    function render() {
      const feed = document.getElementById('cardsFeed');
      feed.innerHTML = '';
      updateCooldownCounter();

      const seenPassages = new Set();

      const filtered = database.filter(item => {
        // فلتر نطاق حفظ الإمام
        if (item.juz < scopeMin || item.juz > scopeMax) return false;

        // فلتر الكتاب
        if (selectedBook !== 'all' && item.book !== selectedBook) return false;

        // فلتر الطول الشرعي
        if (selectedLength !== 'all' && item.lengthTier !== selectedLength) return false;

        // فلتر الموضوع
        if (selectedTopic !== 'all' && item.topicKey !== selectedTopic) return false;

        // فلتر المفضلة
        if (showFavsOnly && !localStorage.getItem('mihrab_fav_' + item.id)) return false;

        // صلاة المغرب: ترجيح المقاطع القصيرة والخفيفة
        if (selectedPrayer === 'maghrib' && item.ayahCount > 8) return false;

        // فحص الحظر
        if (isLocked(item.id)) return false;

        // فلتر البحث الفوري
        if (searchQuery) {
          const inSurah = item.surahName.toLowerCase().includes(searchQuery);
          const inTheme = item.theme.toLowerCase().includes(searchQuery);
          const inTopic = (item.topicLabel || '').toLowerCase().includes(searchQuery);
          const inVerses = (item.verses || []).some(v => v.text.includes(searchQuery));
          if (!inSurah && !inTheme && !inTopic && !inVerses) return false;
        }

        // منع تكرار نفس المقطع
        const uniqueKey = `${item.book}_${item.surahNo}_${item.startAyah}_${item.endAyah}`;
        if (seenPassages.has(uniqueKey)) return false;
        seenPassages.add(uniqueKey);

        return true;
      });

      if (filtered.length === 0) {
        feed.innerHTML = `
          <div class="empty-state">
            <span style="font-size: 2.6rem;">⏳</span>
            <h3 style="color:var(--primary); font-weight:800;">لا توجد مقاطع مطابقة للخيارات المحددة</h3>
            <p style="color:var(--text-muted); font-size:0.9rem; max-width:440px; line-height:1.6;">
              قد تكون المقاطع محظورة مؤقتاً (48 ساعة)، أو تقع خارج نطاق الأجزاء المحفوظة التي حددتها. جرب تعديل الفلاتر أو توسيع نطاق الحفظ.
            </p>
            <button class="confirm-btn" style="width:auto; padding:10px 24px;" onclick="resetAllCooldowns()">
              إعادة إتاحة المحظورات فوراً
            </button>
          </div>
        `;
        return;
      }

      filtered.forEach(sec => {
        const isFav = !!localStorage.getItem('mihrab_fav_' + sec.id);
        const versesHtml = (sec.verses || []).map(v => 
          `${v.text} <span class="verse-badge">﴿${toArabicDigits(v.num)}﴾</span>`
        ).join(' ');

        const card = document.createElement('article');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="card-header-bar">
            <div class="surah-info">
              <span class="surah-title">سورة ${sec.surahName}</span>
              <span class="ayat-tag">الآيات (${toArabicDigits(sec.startAyah)} - ${toArabicDigits(sec.endAyah)})</span>
              <span class="ayat-tag" style="color:var(--gold); font-weight:800;">جزء ${toArabicDigits(sec.juz)}</span>
            </div>
            <div class="header-badges">
              <span class="topic-badge">${sec.topicLabel || 'التوحيد'}</span>
              <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${sec.id}', this)" title="إضافة للمفضلة">
                ${isFav ? '★' : '☆'}
              </button>
            </div>
          </div>

          <div class="card-content">
            <div style="font-size:0.86rem; color:var(--text-muted); font-weight:700;">
              المصدر: ${sec.sourceName} | المستوى: ${sec.lengthLabel || 'معتدل'}
            </div>

            <div class="quran-text-wrapper">${versesHtml}</div>
            
            <div class="rakah-box">
              <span>📖</span>
              <span>دليل الركعتين: الأولى تقف عند آية (${toArabicDigits(sec.rakah1End)})، والثانية تبدأ من آية (${toArabicDigits(sec.rakah2Start)}).</span>
            </div>

            <button class="confirm-btn" onclick="commitRead('${sec.id}', this)">
              <span>✓</span>
              <span>تمت القراءة في الصلاة (حظر 48 ساعة)</span>
            </button>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    initDatabase();
  </script>
</body>
</html>
